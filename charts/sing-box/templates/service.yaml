apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
spec:
  type: {{ .Values.service.type }}
  internalTrafficPolicy: {{ .Values.service.internalTrafficPolicy }}
  selector:
    app: "{{ .Release.Name }}-{{ .Chart.Name }}"
  ports:
    - name: proxy
      port: {{ .Values.port }}
      targetPort: proxy
      protocol: TCP
