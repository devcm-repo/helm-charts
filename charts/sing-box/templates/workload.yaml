{{- if not (has .Values.kind (list "Deployment" "DaemonSet")) }}
{{- fail "kind must be Deployment or DaemonSet" }}
{{- end }}
apiVersion: apps/v1
kind: {{ .Values.kind }}
metadata:
  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
spec:
  {{- if eq .Values.kind "Deployment" }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-{{ .Chart.Name }}"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-{{ .Chart.Name }}"
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sing-box
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "-c", "/etc/sing-box/config.json"]
          ports:
            - name: proxy
              containerPort: {{ .Values.port }}
            {{- if .Values.hysteria2.enabled }}
            - name: hysteria2
              containerPort: {{ .Values.hysteria2.port }}
              hostPort: {{ .Values.hysteria2.port }}
              protocol: UDP
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: proxy
          livenessProbe:
            tcpSocket:
              port: proxy
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/sing-box
              readOnly: true
            {{- if .Values.hysteria2.enabled }}
            - name: tls
              mountPath: /etc/sing-box-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ required "configSecretName is required" .Values.configSecretName | quote }}
            items:
              - key: config.json
                path: config.json
        {{- if .Values.hysteria2.enabled }}
        - name: tls
          secret:
            secretName: {{ required "hysteria2.tlsSecretName is required when Hysteria2 is enabled" .Values.hysteria2.tlsSecretName | quote }}
        {{- end }}
