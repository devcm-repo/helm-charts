image:
  repository: ghcr.io/sagernet/sing-box
  tag: v1.14.4
  pullPolicy: IfNotPresent

kind: Deployment
replicaCount: 1

# Create this Secret with a config.json key before installing.
configSecretName: sing-box-config
port: 54321

service:
  type: ClusterIP
  internalTrafficPolicy: Cluster

hysteria2:
  enabled: false
  port: 443
  tlsSecretName: ""

# TLS is terminated by the Ingress; keep the existing /vws path.
ingress:
  enabled: false
  className: ""
  host: ""
  path: /vws
  annotations: {}
  tls: []

nodeSelector: {}
affinity: {}
tolerations: []
resources: {}
