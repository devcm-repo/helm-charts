controllers:
  main:
    replicas: 1
    strategy: RollingUpdate
    containers:
      main:
        image:
          repository: fillcode/website
          tag: "{{ .Chart.AppVersion }}"
          pullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: http
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: http
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: http
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000

defaultPodOptions:
  annotations: {}
  labels: {}
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    seccompProfile:
      type: RuntimeDefault

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: false
    className: nginx
    hosts:
      - host: fillcode.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - fillcode.com
        secretName: fillcode-com-crt
