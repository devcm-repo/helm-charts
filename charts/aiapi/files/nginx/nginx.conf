load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /dev/stderr;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 120s;
  keepalive_requests 10000;
  types_hash_max_size 2048;
  client_max_body_size 30m;
  server_tokens off;
  client_header_timeout 15;
  client_body_timeout 15;
  reset_timedout_connection on;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # Ingress terminates TLS; retain the public scheme for installers and upstreams.
  map $http_x_forwarded_proto $aiapi_public_scheme {
    https https;
    http http;
    default $scheme;
  }
  map $aiapi_public_scheme $aiapi_default_port {
    https 443;
    default 80;
  }
  map $http_x_forwarded_port $aiapi_public_port {
    ~^[0-9]+$ $http_x_forwarded_port;
    default $aiapi_default_port;
  }

  log_format main '$status [$time_local] $remote_addr "$http_host" "$request" $request_time';
  access_log /dev/stdout main;

  gzip on;
  gzip_comp_level 2;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/javascript application/json application/xml text/css text/javascript text/plain;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cache:100m max_size=1g inactive=1h use_temp_path=off;
  js_engine qjs;
  js_import codex_models from /etc/nginx/conf.d/aiapi.models.js;
  js_set $aiapi_cpa_authorization codex_models.cpaAuthorization;

  upstream newapi_upstream {
    server {{ include "aiapi.fullname" . }}-newapi:{{ .Values.newapi.service.port }};
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 300s;
  }

  upstream cliproxyapi_upstream {
    server {{ include "aiapi.fullname" . }}-cliproxyapi:{{ .Values.cliproxyapi.service.port }};
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 300s;
  }

  # New API 公网入口。
  server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_socket_keepalive on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    include /etc/nginx/conf.d/proxy_headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 100m;
    subrequest_output_buffer_size 5m;

    location = /_nginx_health {
      access_log off;
      return 200 "ok\n";
    }

    # CPA resolves live providers and builds the rich Codex catalog; New API still
    # owns per-key authorization through the public /v1/models intersection.
    location = /_aiapi_cpa_codex_catalog {
      internal;
      proxy_pass http://cliproxyapi_upstream/v1/models?client_version=0.146.0;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $aiapi_cpa_authorization;
      proxy_set_header Accept-Encoding "";
      proxy_cache off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 4s;
    }

    location = /v1/codex/models {
      limit_except GET {
        deny all;
      }

      js_content codex_models.list;
    }

    # AIAPI docs and installers. Docs serve static files only; installer source
    # files stay hidden behind extensionless /getstart shortcuts.
    location = /doc {
      return 301 /doc/;
    }

    location ^~ /doc/shell/ {
      return 404;
    }

    location ^~ /doc/ {
      limit_except GET HEAD {
        deny all;
      }

      alias /usr/share/nginx/html/aiapi/;
      index index.html;
      add_header Cache-Control "public, max-age=300" always;
      add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/getstart/([A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*)$ {
      limit_except GET HEAD {
        deny all;
      }

      types {}
      default_type text/plain;
      charset utf-8;
      root /usr/share/nginx/html/aiapi/shell;
      try_files /$1.sh /$1.ps1 =404;
      sub_filter_types text/plain;
      sub_filter_once off;
      sub_filter "__AIAPI_SITE_ORIGIN__" "$aiapi_public_scheme://$http_host";
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
    }

    location = /getstart {
      return 404;
    }

    location /getstart/ {
      return 404;
    }

    location = /cpa {
      return 302 /cpa/management.html;
    }

    location = /cpa/ {
      return 302 /cpa/management.html;
    }

    # 管理 UI 入口加一层 nginx Basic Auth；Management API 仍使用 Bearer 管理密钥。
    location = /cpa/management.html {
      auth_basic "CLIProxyAPI Management";
      auth_basic_user_file /etc/nginx/htpasswd/cliproxyapi.htpasswd;

      proxy_pass http://cliproxyapi_upstream/management.html;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    location ^~ /cpa/ {
      rewrite ^/cpa/(.*)$ /$1 break;
      proxy_pass http://cliproxyapi_upstream;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # OpenAI 兼容接口通常是 SSE/流式输出，低延迟优先：不缓冲、不缓存、不压缩上游响应。
    location ^~ /v1/ {
      proxy_pass http://newapi_upstream;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      access_log off;

      add_header X-Accel-Buffering no always;

      include /etc/nginx/conf.d/proxy_headers.conf;
      proxy_set_header Accept-Encoding "";

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # New API 前端构建产物体积较大，复用通用静态资源缓存配置。
    set $proxy_url http://newapi_upstream;
    location ~ .*\.(ico|gif|jpg|jpeg|png|webp|bmp|swf|svg|ttf|woff|woff2)$ {
      proxy_pass $proxy_url;
      expires 30d;
      include /etc/nginx/conf.d/static_cache.conf;
    }

    location ~ .*\.(css|js|map)$ {
      proxy_pass $proxy_url;
      expires 7d;
      include /etc/nginx/conf.d/static_cache.conf;
    }

    location / {
      proxy_pass http://newapi_upstream;
    }
  }
}
