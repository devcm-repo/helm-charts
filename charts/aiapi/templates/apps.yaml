{{- $fullname := include "aiapi.fullname" . -}}
{{- $configSecret := include "aiapi.configSecretName" . -}}
{{- $controllers := dict -}}
{{- $services := dict -}}
{{- $volumes := dict -}}
{{- $secretChecksum := include (print $.Template.BasePath "/secret.yaml") . | sha256sum -}}
{{- with .Values.existingSecret -}}
  {{- $secret := lookup "v1" "Secret" $.Release.Namespace . -}}
  {{- $secretChecksum = toJson ($secret.data | default dict) | sha256sum -}}
{{- end -}}
{{- $apps := dict "newapi" .Values.newapi "cliproxyapi" .Values.cliproxyapi -}}
{{- if .Values.nginx.enabled -}}
  {{- $_ := set $apps "nginx" (merge (dict "replicas" 1 "port" 8080 "service" (dict "port" 8080 "type" "ClusterIP")) .Values.nginx) -}}
{{- end -}}

{{- range $name, $app := $apps -}}
  {{- $labels := dict "app.kubernetes.io/component" $name -}}
  {{- $tz := $app.tz | default $.Values.tz -}}
  {{- $env := concat (list (dict "name" "TZ" "value" $tz)) ($app.extraEnv | default list) -}}
  {{- if eq $name "newapi" -}}
    {{- $env = include "aiapi.newapiEnv" $ | fromYamlArray -}}
  {{- end -}}
  {{- $probeSpec := dict "tcpSocket" (dict "port" "http") -}}
  {{- if eq $name "nginx" -}}
    {{- $probeSpec = dict "httpGet" (dict "path" "/_nginx_health" "port" "http") -}}
  {{- end -}}
  {{- $probe := dict "enabled" true "custom" true "spec" $probeSpec -}}
  {{- $container := dict "image" $app.image "env" $env "resources" $app.resources
        "ports" (list (dict "name" "http" "containerPort" $app.port "protocol" "TCP"))
        "probes" (dict "readiness" $probe "liveness" $probe) -}}
  {{- $annotations := merge (dict "checksum/secret" $secretChecksum) (deepCopy $.Values.podAnnotations) -}}
  {{- $pod := dict "annotations" $annotations -}}
  {{- $containers := dict $name $container -}}
  {{- if and (eq $name "cliproxyapi") $.Values.cliproxyapi.proxy.enabled -}}
    {{- $proxy := $.Values.cliproxyapi.proxy -}}
    {{- $proxySecretName := required "cliproxyapi.proxy.configSecretName is required when proxy.enabled is true" $proxy.configSecretName -}}
    {{- $proxySecret := lookup "v1" "Secret" $.Release.Namespace $proxySecretName -}}
    {{- $_ := set $annotations "checksum/proxy" (toJson ($proxySecret.data | default dict) | sha256sum) -}}
    {{- $proxyProbe := dict "enabled" true "custom" true "spec" (dict
          "exec" (dict "command" (list "sh" "-c" "nc -z 127.0.0.1 1080"))
          "periodSeconds" 10 "timeoutSeconds" 2 "failureThreshold" 3) -}}
    {{- $_ := set $containers "sing-box" (dict "image" $proxy.image "resources" $proxy.resources
          "args" (list "run" "-c" "/etc/sing-box/config.json")
          "securityContext" (dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true
            "runAsNonRoot" true "runAsUser" 65532 "capabilities" (dict "drop" (list "ALL")))
          "probes" (dict "readiness" $proxyProbe "liveness" $proxyProbe)) -}}
    {{- $_ := set $volumes "sing-box-config" (dict "type" "secret" "name" $proxySecretName
          "items" (list (dict "key" "config.json" "path" "config.json"))
          "advancedMounts" (dict $name (dict "sing-box" (list
            (dict "path" "/etc/sing-box" "readOnly" true))))) -}}
  {{- end -}}
  {{- if eq $name "nginx" -}}
    {{- $_ := set $annotations "checksum/config" (include (print $.Template.BasePath "/nginx-configmap.yaml") $ | sha256sum) -}}
    {{- $_ := set $pod "automountServiceAccountToken" false -}}
  {{- end -}}
  {{- $updateStrategy := $app.updateStrategy | default (dict "type" "Recreate") -}}
  {{- if eq $name "nginx" -}}
    {{- $updateStrategy = dict "type" "RollingUpdate" -}}
  {{- end -}}
  {{- $waitForKvLock := and (eq $name "cliproxyapi") $app.waitForKvLock -}}
  {{- $writableConfig := and (eq $name "cliproxyapi") $app.writableConfig -}}
  {{- $initContainers := dict -}}
  {{- if $waitForKvLock -}}
    {{- if or (not $app.persistence.enabled) (gt (int $app.replicas) 1) -}}
      {{- fail "cliproxyapi.waitForKvLock requires persistent storage and at most one replica" -}}
    {{- end -}}
    {{- $maxSurge := get ($updateStrategy.rollingUpdate | default dict) "maxSurge" | toString -}}
    {{- if and (eq $updateStrategy.type "RollingUpdate") (not (has $maxSurge (list "0" "0%"))) -}}
      {{- fail "cliproxyapi.waitForKvLock requires maxSurge: 0 for rolling updates" -}}
    {{- end -}}
    {{- $wait := "if [ -f /auths/kv.db ]; then exec 9</auths/kv.db; flock -s -w 60 9; fi" -}}
    {{- $_ := set $initContainers "wait-for-kv" (dict "image" $app.image "resources" $app.resources
          "command" (list "/bin/sh" "-ec" $wait)) -}}
  {{- end -}}
  {{- if $writableConfig -}}
    {{- if or (not $app.persistence.enabled) (gt (int $app.replicas) 1) -}}
      {{- fail "cliproxyapi.writableConfig requires persistent storage and at most one replica" -}}
    {{- end -}}
    {{- if and (eq $updateStrategy.type "RollingUpdate") (not $waitForKvLock) -}}
      {{- fail "cliproxyapi.writableConfig requires cliproxyapi.waitForKvLock with RollingUpdate" -}}
    {{- end -}}
    {{- $script := $.Files.Get "files/cliproxyapi/prepare-config.sh" -}}
    {{- $prepare := dict "image" $app.image "resources" $app.resources
          "command" (list "/bin/sh" "-ec" $script "prepare-config" "/run/cliproxyapi-bootstrap/config.yaml" "/var/lib/cliproxyapi") -}}
    {{- if $waitForKvLock -}}
      {{- $_ := set $prepare "dependsOn" "wait-for-kv" -}}
    {{- end -}}
    {{- $_ := set $initContainers "prepare-config" $prepare -}}
    {{- $_ := set $container "command" (list "/CLIProxyAPI/CLIProxyAPI") -}}
    {{- $_ := set $container "args" (list "-config" "/var/lib/cliproxyapi/config.yaml") -}}
  {{- end -}}
  {{- $_ := set $controllers $name (dict
        "type" "deployment" "forceRename" (printf "%s-%s" $fullname $name)
        "replicas" $app.replicas "revisionHistoryLimit" 10
        "strategy" $updateStrategy.type "rollingUpdate" $updateStrategy.rollingUpdate
        "labels" $labels "pod" $pod "containers" $containers "initContainers" $initContainers) -}}
  {{- $_ := set $services $name (dict
        "controller" $name "forceRename" (printf "%s-%s" $fullname $name)
        "type" $app.service.type "labels" $labels "annotations" ($app.service.annotations | default dict)
        "ports" (dict "http" (dict "port" $app.service.port "targetPort" "http"))) -}}
  {{- if ne $name "nginx" -}}
    {{- $mounts := list (dict "path" "/data" "subPath" "data") (dict "path" "/app/logs" "subPath" "logs") -}}
    {{- if eq $name "cliproxyapi" -}}
      {{- $mounts = list (dict "path" "/root/.cli-proxy-api" "subPath" "auths")
            (dict "path" "/CLIProxyAPI/logs" "subPath" "logs") (dict "path" "/CLIProxyAPI/plugins" "subPath" "plugins") -}}
    {{- end -}}
    {{- $appMounts := dict $name $mounts -}}
    {{- if $waitForKvLock -}}
      {{- $_ := set $appMounts "wait-for-kv" (list (dict "path" "/auths" "subPath" "auths" "readOnly" true)) -}}
    {{- end -}}
    {{- if $writableConfig -}}
      {{- $configMount := dict "path" "/var/lib/cliproxyapi" "subPath" "config" -}}
      {{- $_ := set $appMounts $name (append $mounts $configMount) -}}
      {{- $_ := set $appMounts "prepare-config" (list $configMount) -}}
    {{- end -}}
    {{- $_ := set $volumes (printf "%s-data" $name) (dict
          "type" (ternary "persistentVolumeClaim" "emptyDir" $app.persistence.enabled)
          "forceRename" (printf "%s-%s" $fullname $name) "retain" false
          "size" $app.persistence.size "accessMode" $.Values.persistence.accessMode
          "storageClass" $.Values.persistence.storageClass "annotations" $.Values.persistence.annotations "labels" $labels
          "advancedMounts" (dict $name $appMounts)) -}}
  {{- end -}}
{{- end -}}

{{- with .Values.cliproxyapi.caSecretName -}}
{{- $_ := set $volumes "cliproxyapi-ca" (dict "type" "secret" "name" .
      "items" (list (dict "key" "ca-certificates.crt" "path" "ca-certificates.crt"))
      "advancedMounts" (dict "cliproxyapi" (dict "cliproxyapi" (list
        (dict "path" "/etc/ssl/certs/ca-certificates.crt" "subPath" "ca-certificates.crt" "readOnly" true))))) -}}
{{- end -}}

{{- $configMounts := dict "cliproxyapi" (list (dict "path" "/CLIProxyAPI/config.yaml" "subPath" "config.yaml")) -}}
{{- if .Values.cliproxyapi.writableConfig -}}
  {{- $configMounts = dict "prepare-config" (list (dict "path" "/run/cliproxyapi-bootstrap" "readOnly" true)) -}}
{{- end -}}
{{- $_ := set $volumes "cliproxyapi-config" (dict "type" "secret" "name" $configSecret
      "items" (list (dict "key" "cliproxyapi-config.yaml" "path" "config.yaml"))
      "advancedMounts" (dict "cliproxyapi" $configMounts)) -}}

{{- if .Values.nginx.enabled -}}
  {{- $siteItems := list -}}
  {{- range $path, $_ := .Files.Glob "files/nginx/www/**" -}}
    {{- $siteItems = append $siteItems (dict "key" (base $path) "path" (trimPrefix "files/nginx/www/" $path)) -}}
  {{- end -}}
  {{- $nginxVolumes := dict
        "config" (dict "type" "configMap" "name" (printf "%s-nginx" $fullname) "mounts" (list
          (dict "path" "/etc/nginx/nginx.conf" "subPath" "nginx.conf" "readOnly" true)
          (dict "path" "/etc/nginx/conf.d" "readOnly" true)))
        "site" (dict "type" "configMap" "name" (printf "%s-nginx-site" $fullname) "items" $siteItems
          "mounts" (list (dict "path" "/usr/share/nginx/html/aiapi" "readOnly" true)))
        "cpa-config" (dict "type" "secret" "name" $configSecret
          "items" (list (dict "key" "cliproxyapi-config.yaml" "path" "cliproxyapi-config.yaml"))
          "mounts" (list (dict "path" "/run/secrets" "readOnly" true)))
        "basic-auth" (dict "type" (ternary "secret" "configMap" (not (empty .Values.nginx.basicAuthSecretName)))
          "name" (default (printf "%s-nginx" $fullname) .Values.nginx.basicAuthSecretName)
          "items" (list (dict "key" "cliproxyapi.htpasswd" "path" "cliproxyapi.htpasswd"))
          "mounts" (list (dict "path" "/etc/nginx/htpasswd" "readOnly" true))) -}}
  {{- range $name, $volume := $nginxVolumes -}}
    {{- $_ := set $volume "advancedMounts" (dict "nginx" (dict "nginx" $volume.mounts)) -}}
    {{- $_ := unset $volume "mounts" -}}
    {{- $_ := set $volumes $name $volume -}}
  {{- end -}}
{{- end -}}

{{- $values := dict "common" .Values.common "nameOverride" .Values.nameOverride
      "global" (dict "fullnameOverride" $fullname "createDefaultServiceAccount" false "templateEvaluation" (dict "passes" 0))
      "defaultPodOptions" (dict "nodeSelector" .Values.nodeSelector "affinity" .Values.affinity
        "imagePullSecrets" .Values.imagePullSecrets "automountServiceAccountToken" true "enableServiceLinks" true)
      "controllers" $controllers "service" $services "persistence" $volumes -}}
{{- $context := merge (dict "Values" $values) (omit . "Values") -}}
{{- include "bjw-s.common.loader.all" $context -}}
