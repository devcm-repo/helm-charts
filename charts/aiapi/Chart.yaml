apiVersion: v2
name: aiapi
description: New API, CLIProxyAPI and nginx/njs gateway Helm Chart
home: https://devcm-repo.github.io/helm-charts/
sources:
  - https://github.com/devcm-repo/helm-charts
maintainers:
  - name: dev.cm
    email: admin@dev.cm
    url: https://github.com/devcm-repo
version: 0.0.3
appVersion: latest
kubeVersion: ">=1.31.0-0"
dependencies:
  - name: common
    version: 5.3.0
    repository: oci://ghcr.io/bjw-s-labs/helm
  - name: postgresql
    version: 18.6.2
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: valkey
    version: 5.4.11
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: valkey.enabled
